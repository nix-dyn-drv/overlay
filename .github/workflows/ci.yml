name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CACHIX_CACHE: dynamicderivations

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build + benchmark across packages
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # trynix (below) evaluates .#dyndrv-* attrs via a plain,
          # daemon-mediated `nix eval` -- unlike run-nix-ci.sh's own
          # patched-Nix + `sudo`+`--store local` path, which the ambient
          # ecosystem's post-install daemon config doesn't grant. A
          # per-invocation `--extra-experimental-features` flag can't
          # retroactively grant these to an already-running daemon; only
          # the daemon's own nix.conf at install time can (same fix
          # dyn-drvs' own CI needed, "ci: enable ca-derivations/
          # dynamic-derivations on the ambient nix-daemon"). This does
          # NOT grant builder-rpc-v0 -- only the patched-Nix path used
          # elsewhere in this workflow can build a dynamic derivation;
          # this just lets ordinary tooling (trynix) eval/resolve one
          # that's already built and cached.
          extra-conf: |
            extra-experimental-features = nix-command flakes ca-derivations dynamic-derivations recursive-nix

      # Pull-only, no token needed -- works for fork PRs too, since the
      # cache is public-readable. Push (below) is separate and gated on
      # secret access. Real /nix/store now (see run-nix-ci.sh), so this
      # cache substitutes/pushes exactly like an ordinary `nix build`.
      - uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Verify run-nix-ci.sh can fetch+build a working Nix
        run: ./try-it-out/run-nix-ci.sh --version

      # Catches a broken/typo'd package definition even if it isn't
      # named in any of the explicit for-loops below -- e.g. this
      # session's own stale zstd `target` param (pre-multi-target API)
      # would have failed here immediately instead of only surfacing
      # when someone happened to build .#zstd by hand. nixninja-argp is
      # the one pre-existing, known-broken flake output (nix-ninja's
      # own flake pins a nixpkgs revision predating `builtins.outputOf`,
      # unrelated to anything in this repo) -- exits nonzero on its own,
      # so this step only fails if MORE than that one output errors.
      - name: nix flake check (all packages evaluate)
        run: |
          set +e
          nix flake check --no-write-lock-file --no-build 2>&1 | tee /tmp/flake-check.log
          set -e
          failed=$(grep -c '^❌' /tmp/flake-check.log || true)
          unexpected=$(grep '^❌' /tmp/flake-check.log | grep -v 'nixninja-argp$' || true)
          echo "failed outputs: $failed (expect at most 1: nixninja-argp)"
          if [[ "$failed" -gt 1 ]] || [[ -n "$unexpected" ]]; then
            echo "::error::nix flake check found unexpected failures beyond the known nixninja-argp gap -- see log above"
            exit 1
          fi

      # Tier 0 (freetype, giflib, tree, figlet, nnn, gperf) are the
      # dyn-drvs packages that build clean end to end
      # (benchmarks/RESULTS.md); hard gate here. zstd/mosh/openssl/
      # tinycbor each hit a distinct open dyn-drvs bug
      # (nix/packages/{zstd,mosh,openssl,tinycbor}.nix) and run
      # informationally below instead, so this job's pass/fail tracks
      # regressions in the proven path, not upstream bugs it can't fix.
      - name: Build proven dyndrv packages (freetype, giflib, tree, figlet, nnn, gperf)
        run: |
          for attr in dyndrv-freetype dyndrv-giflib dyndrv-tree dyndrv-figlet dyndrv-nnn dyndrv-gperf; do
            echo "::group::Building .#$attr"
            ./try-it-out/run-nix-ci.sh build --impure --no-link --print-out-paths -Lv \
              ".#$attr" 2>&1 | tee "/tmp/$attr.log"
            echo "::endgroup::"
          done

      # cargo-dyndrv mechanism: fifth independent implementation of the
      # same builtins.outputOf/builder-rpc-v0 primitive, per-crate
      # dynamic derivations for Rust. cargo-dyndrv-dyn (the tool
      # building itself) is a hard gate, a genuine pass; hyperfine is a
      # documented BLOCKED finding (nix/packages/hyperfine-cargo-dyndrv.nix)
      # so it runs informationally instead.
      - name: Build cargo-dyndrv-dyn (tool building itself, ~50 crates)
        run: |
          ./try-it-out/run-nix-ci.sh build --impure --no-link --print-out-paths -Lv \
            .#cargo-dyndrv-dyn 2>&1 | tee /tmp/cargo-dyndrv-dyn.log

      - name: "Attempt hyperfine via cargo-dyndrv (informational, non-blocking, documented BLOCKED)"
        continue-on-error: true
        run: |
          ./try-it-out/run-nix-ci.sh build --impure --no-link --print-out-paths -Lv \
            .#hyperfine-cargo-dyndrv 2>&1 | tee /tmp/hyperfine-cargo-dyndrv.log || true

      # nix-ninja (mkMesonPackage) and drowse (callPackage) are two more
      # independent dynamic-derivations mechanisms, same patched-Nix path
      # as the dyn-drvs tier above. nix-ninja intermittently hits a
      # real-/nix/store-only failure not reproduced against the
      # redirected alt-store locally (ninja's own generated "install"
      # step runs and writes to mkMesonPackage's literal `/nonexistent`
      # placeholder) -- informational until root-caused, so it doesn't
      # block regressions in drowse or the proven dyndrv tier above.
      - name: "Build nix-ninja and drowse mechanisms (argp-standalone, hello)"
        continue-on-error: true
        run: |
          for attr in nixninja-argp drowse-hello; do
            echo "::group::Building .#$attr"
            ./try-it-out/run-nix-ci.sh build --impure --no-link --print-out-paths -Lv \
              ".#$attr" 2>&1 | tee "/tmp/$attr.log" || true
            echo "::endgroup::"
          done

      # nixgg-mechanism coverage: openssl, hello, mosh, zstd all build via
      # plain stdenv override, but need nixgg's own patched-nix + feature
      # flags (see run-nixgg-ci.sh) -- the ambient daemon lacks
      # ca-derivations/dynamic-derivations by default. nixgg-lua(-batch)
      # tests batchGroups' TU-batching win; libb64-nixgg is a two-phase
      # escape hatch for self-exec-mid-build, contrasting dyn-drvs'
      # permanent exec-bit limitation on this exact package.
      - name: Build nixgg-mechanism packages (openssl, hello, mosh, zstd, lua, libb64)
        run: |
          for attr in openssl hello mosh zstd nixgg-lua nixgg-lua-batch libb64-nixgg; do
            echo "::group::Building .#$attr"
            ./try-it-out/run-nixgg-ci.sh build --impure --no-link --print-out-paths -Lv \
              ".#$attr" 2>&1 | tee "/tmp/nixgg-$attr.log"
            echo "::endgroup::"
          done

      - name: Restore benchmark history
        id: bench-cache
        uses: actions/cache@v4
        with:
          path: benchmarks/history.jsonl
          key: bench-history-${{ github.run_id }}
          restore-keys: bench-history-

      - name: Patch-rebuild benchmark (freetype) + append to history
        run: |
          RUN_NIX=./try-it-out/run-nix-ci.sh \
            ./benchmarks/patch-rebuild.sh \
              packages.x86_64-linux.dyndrv-freetype-baseline \
              packages.x86_64-linux.dyndrv-freetype \
              | tee /tmp/freetype-bench.log

          ratio=$(grep -oP 'ratio: \K[0-9.]+' /tmp/freetype-bench.log || echo "n/a")
          printf '{"run_id":"%s","sha":"%s","date":"%s","package":"freetype","ratio":"%s"}\n' \
            "${{ github.run_id }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" "$ratio" \
            >> benchmarks/history.jsonl

      - name: Trend table in step summary
        run: |
          {
            echo "### Benchmark trend (freetype patch-rebuild ratio, plain/accelerated)"
            echo ""
            echo "| run | date | ratio |"
            echo "|---|---|---|"
            tail -n 10 benchmarks/history.jsonl | \
              jq -r '"| \(.run_id) | \(.date) | \(.ratio)x |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save benchmark history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: benchmarks/history.jsonl
          key: bench-history-${{ github.run_id }}

      # Second, independent trend view: a live chart on gh-pages via
      # benchmark-action/github-action-benchmark, alongside the
      # plain-text history.jsonl trend table above.
      - name: Record benchmark for gh-pages chart
        if: github.event_name == 'push'
        run: |
          ratio=$(grep -oP 'ratio: \K[0-9.]+' /tmp/freetype-bench.log || echo "0")
          jq -n --arg ratio "$ratio" \
            '[{"name": "freetype patch-rebuild speedup (plain/accelerated)", "unit": "x", "value": ($ratio | tonumber)}]' \
            > /tmp/gh-pages-bench.json

      - name: Publish to gh-pages benchmark chart
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: /tmp/gh-pages-bench.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/dashboard
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

      # Third view: the actual gh-pages landing page (index.html),
      # rendered from benchmarks/RESULTS.md via pandoc instead of
      # hand-edited -- the page drifted for weeks under the old
      # hand-maintained version (see benchmarks/render-index.sh's own
      # header for why). Runs even if the benchmark-action step above
      # already pushed a commit to gh-pages; this step fetches fresh
      # before amending its own file, so it never conflicts.
      - name: Render and publish gh-pages landing page
        if: github.event_name == 'push'
        run: |
          PANDOC=$(nix build nixpkgs#pandoc --no-link --print-out-paths)
          PATH="$PANDOC/bin:$PATH" ./benchmarks/render-index.sh > /tmp/index.html

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages-publish origin/gh-pages
          cp /tmp/index.html /tmp/gh-pages-publish/index.html
          cd /tmp/gh-pages-publish
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html unchanged, nothing to push"
          else
            git add index.html
            git commit -m "Render index.html from benchmarks/RESULTS.md for ${{ github.sha }}"
            git push origin HEAD:gh-pages
          fi

      # Informational: won't fail the job, just flags when a dyn-drvs fix lands.
      - name: "Blocked tiers (informational, non-blocking): zstd, mosh, tinycbor, libpng, libtasn1"
        continue-on-error: true
        run: |
          {
            echo "### Blocked-tier status (see nix/packages/*.nix)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for attr in dyndrv-zstd dyndrv-mosh dyndrv-tinycbor dyndrv-libpng dyndrv-libtasn1; do
            echo "::group::Attempting .#$attr (expected to fail, see nix/packages/$attr.nix)"
            if ./try-it-out/run-nix-ci.sh build --impure --no-link --print-out-paths \
                ".#$attr" > "/tmp/$attr.log" 2>&1; then
              echo "$attr: PASSED (unexpected -- a dyn-drvs fix may have landed, update RESULTS.md/README)" \
                >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$attr: still blocked (see /tmp/$attr.log in job logs)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done

      - name: Push to Cachix (same-repo contexts only)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo "No CACHIX_AUTH_TOKEN secret configured -- skipping push."
            exit 0
          fi
          for attr in openssl hello mosh zstd nixgg-lua nixgg-lua-batch libb64-nixgg; do
            OUT=$(./try-it-out/run-nixgg-ci.sh build --impure --no-link --print-out-paths ".#$attr" || true)
            [[ -n "$OUT" ]] && echo "$OUT" | cachix push "$CACHIX_CACHE"
          done
          OUT=$(./try-it-out/run-nix-ci.sh build --impure --no-link --print-out-paths .#dyndrv-freetype)
          echo "$OUT" | cachix push "$CACHIX_CACHE"
          for attr in dyndrv-giflib dyndrv-tree dyndrv-figlet dyndrv-nnn dyndrv-gperf cargo-dyndrv-dyn nixninja-argp drowse-hello; do
            OUT=$(./try-it-out/run-nix-ci.sh build --impure --no-link --print-out-paths ".#$attr" || true)
            [[ -n "$OUT" ]] && echo "$OUT" | cachix push "$CACHIX_CACHE"
          done

      # Reviewer convenience: post a PR comment with a "boot this build in
      # your browser" link (trynix.dev, in-browser QEMU + WASM) for a
      # proven, already-cached package -- no relation to the
      # dynamic-derivations mechanism itself, just a UX add-on over the
      # Cachix push above. Same same-repo gate as the push itself, since
      # a fork PR never pushed anything for trynix to find in the cache.
      #
      # continue-on-error: this step has intermittently failed trying to
      # resolve .#openssl's dynamic-derivation placeholder from the
      # cache, even after the "Push to Cachix" step above (which runs
      # first in job order) has already pushed it -- root cause not
      # nailed down (tried `build: true`, which made it worse: the
      # ambient daemon lacks builder-rpc-v0 entirely, so trynix's own
      # `nix build` attempt fails outright rather than just warning).
      # Non-blocking for now, matching the nix-ninja step's same
      # informational-until-root-caused treatment above.
      - name: Post trynix boot link (PR comments only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: fzakaria/trynix@v1
        with:
          cache: https://dynamicderivations.cachix.org
          publicKey: dynamicderivations.cachix.org-1:AmDuQASmWJsVYB/r0TGTZnQSnoxPzKP8ijfGw/6aT3k=
          attrs: .#openssl
          githubToken: ${{ secrets.GITHUB_TOKEN }}
